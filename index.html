<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/Main.css">
  <link rel="stylesheet" href="CSS/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./fontawesome-free-7.1.0-web/css/all.min.css">
  <title>CRUD</title>
</head>
<body>

  <section class="mx-auto container mt-5 rounded-4 p-5 shadow-lg">
    <div class="mx-auto">
          <h1 id="info" class="text-center text-info fw-bolder fst-italic">
      CRUD
    </h1>
    </div>
    <div class="form-floating mb-3">
  <input type="text" class="form-control border-0 border-bottom" id="ProductName" placeholder="Product Name">
  <label for="Product Name">Product Name:</label>
  <p id="valid" class="d-none alert alert-success mt-2">Succsess</p>
  <p id="validx" class="d-none alert alert-danger mt-2">Product Name is empty</p>
    </div>

    <div class="form-floating mb-3">
  <input type="number" class="form-control border-0 border-bottom" id="ProductPrice" placeholder="Product Price">
  <label for="Product Price">Product Price:</label>
   <p id="validp" class="d-none alert alert-danger mt-2">Product Price is empty</p>
</div>

    <div class="form-floating mb-3">
  <input type="discri" class="form-control border-0 border-bottom" id="ProductCategory" list="lista" placeholder="Product Category">
  <label for="Product Category">Product Category:</label>
     <p id="validc" class="d-none alert alert-danger mt-2">Product Category is empty</p>
  <datalist id="lista">
    <option value="TV"></option>
    <option value="Camera"></option>
    <option value="Laptop"></option>
    <option value="Mobile"></option>
  </datalist>
</div>

    <div class="form-floating mb-3">
  <textarea type="text" class="form-control border-0 border-bottom" id="ProductDiscrption" placeholder="Product Discrption"></textarea>
  <label for="Product Discrption">Product Discrption:</label>
</div>

    <div class="form-floating mb-3">
  <input type="file" class="form-control border-0 border-bottom" id="ProductImage" placeholder="Product Image">
  <label for="Product Image">Product Image:</label>
</div>

<button id="addBtn" type="button"
            class="btn btn-info text-white">
  Add Product
</button>
<button id="updateBtn" type="button" class="d-none btn btn-warning text-white">
  Update Product
</button>


    <div class="form-floating mb-3 mt-4">
  <input onkeyup="SearchProduct();" class="form-control border-0 border-bottom" id="SearchProduct" placeholder="SearchProduct">
  <label for="Product Image"> Search Product ....</label>
  <p id="searchBar" class="d-none fs-4 text-danger text-center mt-3">Not Match</p>
</div>
  </section>
<div></div>
<div class="container">
<div id="rowData" class="row">
</div>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./JS/Main.js"></script>

</body>
</html>
